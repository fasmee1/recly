[package]
name = "recly"
version = "0.1.0"
description = "Recly - lightweight screen recorder"
authors = ["Recly"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin on Windows.
name = "recly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
hound = "3.5"
chrono = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
